name: frontend-tests

# 前端此前没有任何自动化测试，改动只靠手工点击验证。
# 这条流水线跑类型检查、构建与 Playwright 冒烟（不需要后端，API 全部 mock）。
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本仓库 .gitignore 忽略了 package-lock.json，所以用 install 而非 ci
      # （npm ci 强制要求 lock 文件存在）。
      - run: npm install

      # 只装 chromium：冒烟测试的两个 project 都基于 Chromium
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E smoke
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

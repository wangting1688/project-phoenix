name: backend-tests

# 之前每次改动都靠手工验证，已经因此漏过一次误覆盖文件导致服务起不来。
# 这条流水线在每次 push / PR 时跑后端 P0 回归。
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 渲染相关测试需要真实 ffmpeg；没有它 conftest 会自动跳过这部分，
      # 但 CI 里应该真跑，所以显式安装。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-microhei

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest

[pytest]
# 测试从 backend 目录运行：cd backend && python -m pytest
testpaths = tests
# 已有测试是 unittest 风格（TestCase 子类），pytest 可直接收集
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 已知的第三方/框架弃用告警会淹没真实问题，先屏蔽掉
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = -q --strict-markers
